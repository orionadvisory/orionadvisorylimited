name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend/backend boundary (frontends talk to the API, never the database)
        run: |
          if grep -rnE 'from "(@orion/db|drizzle-orm|bcryptjs|@neondatabase/serverless|@orion/core/storage)' frontend/*/src; then
            echo "::error::A frontend imports server-only code. Go through the Orion API instead."
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @orion/api build

  api-image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/api/Dockerfile --build-arg APP_VERSION=${GITHUB_SHA::7} -t orion-api .
